{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% set card %}
<div class="min-h-[50vh] grid place-items-center text-center">
  <div><div class="text-6xl font-bold text-indigo-500">{{ code }}</div>
  <p class="mt-3 text-slate-500 dark:text-slate-400">{{ detail }}</p>
  <a href="{{ home }}" class="mt-6 inline-block rounded-lg bg-indigo-600 px-4 py-2 text-white">{{ 'Back to my files' if portal else 'Back to dashboard' }}</a></div>
</div>
{% endset %}
{% block content %}{{ card }}{% endblock %}
{% block bare %}{{ card }}{% endblock %}
