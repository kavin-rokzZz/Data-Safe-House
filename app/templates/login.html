{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block bare %}
<div class="min-h-screen flex items-center justify-center p-4">
  <form method="post" action="/login" class="w-full max-w-sm rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-8 shadow-xl space-y-5">
    <div class="text-center">
      <div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-xl bg-indigo-500/15 text-indigo-500">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7h16v4H4zM4 13h16v4H4zM8 9h.01M8 15h.01"/></svg></div>
      <h1 class="text-xl font-semibold">NAS Admin</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Sign in to manage your backups</p>
    </div>
    {% if error %}<div class="rounded-lg bg-rose-50 dark:bg-rose-500/10 border border-rose-300 dark:border-rose-500/40 px-3 py-2 text-sm text-rose-700 dark:text-rose-300">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">Username
      <input name="username" autocomplete="username" autofocus required class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></label>
    <label class="block text-sm">Password
      <input name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></label>
    <button class="w-full rounded-lg bg-indigo-600 py-2 font-medium text-white hover:bg-indigo-500">Sign in</button>
    <p class="text-center text-xs text-slate-500">Not an admin? <a class="text-indigo-500 hover:underline" href="/portal/login">User sign in</a></p>
  </form>
</div>
{% endblock %}
